<!DOCTYPE html>
<html dir="rtl" lang="fa">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Sign up page" />
    <title>Noori || Sing up</title>
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="./apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="./favicon-16x16.png"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <link rel="manifest" href="./site.webmanifest" />
    <!-- <link rel="stylesheet" href="./CSS/bootstrap.rtl.min.css" /> -->
    <link rel="stylesheet" href="./main.css" />
    <link rel="stylesheet" href="./SignIn.css" />
  </head>
  <body>
    <div class="container">
      <div class="login-form">
        <h2>ثبت نام در سایت</h2>
        <form action="#">
          <label for="firstname">نام</label>
          <input
            type="text"
            id="firstname"
            name="firstname"
            placeholder="لطفا نام خود را وارد نمایید"
          />
          <label for="lastname">نام خانوادگی</label>
          <input
            type="text"
            id="lastname"
            name="lastname"
            placeholder="لطفا نام خانوادگی خود را وارد نمایید"
          />
          <label for="mail">ایمیل</label>
          <input
            type="email"
            id="mail"
            name="mail"
            placeholder="لطفا ایمیل خود را وارد نمایید"
          />
          <label for="pass">رمز عبور</label>
          <input
            type="password"
            id="pass"
            name="pass"
            placeholder="لطفا رمز عبور خود را وارد نمایید"
          />
          <button type="submit" class="btn">ثبت نام</button>
          <p>حساب کاربری دارید؟ <a href="./Signin.html">وارد شوید</a></p>
        </form>
      </div>
      <div class="login-photo"></div>
    </div>
    <footer class="footer">
      <a href="https://web.telegram.org/k/#@ali_nooralian">علی نورعلیان</a>
    </footer>
  </body>
</html>
